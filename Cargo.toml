[package]
name = "c-backup"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Back up and restore everything Claude Code keeps for one project folder: transcripts, plans, memory, checkpoints."
keywords = ["claude-code", "backup", "transcripts", "cli"]

[[bin]]
name = "c-backup"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
gethostname = "1.1.0"
memchr = "2.8.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tempfile = "3.27.0"
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
